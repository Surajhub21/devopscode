apiVersion: apps/v1
kind: Deployment

metadata:
  name: spring-app

spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
        - name: spring-app
          image: suraj7551/demo-app:05
          env:
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: config-map-for-spring-mongo-pod
                  key: MONGO_HOST
            - name: MONGO_PORT
              valueFrom:
                configMapKeyRef:
                  name: config-map-for-spring-mongo-pod
                  key: MONGO_PORT



---

apiVersion: v1
kind: Service

metadata:
  name: service-spring-app

spec:
  selector:
    app: spring-app
  ports:
    - name: http
      port: 8081 #node port
      targetPort: 8081 #app port
      nodePort: 30081 #host machine
  type: NodePort

      